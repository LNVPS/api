db: "mysql://root:root@localhost:3377/lnvps"
# Payment providers (LND Lightning + on-chain) are seeded into the
# payment_method_config table by scripts/run-e2e.sh, not configured here.
delete-after: 3
public-url: "http://localhost:8000"
read-only: true
redis:
  url: "redis://localhost:6399"
  ttl: 30
nostr:
  relays:
    - "ws://localhost:7766"
  nsec: "nsec1q6qm0rwu7ws4pcrqmyhrks2p0c8ht95c5u0r44ukt5fzwur5sg4s0msjlw"
encryption:
  key-file: "/tmp/e2e-encryption.key"
  auto-generate: true
# Passkey (WebAuthn) config for the passkey e2e tests. rp-origin must match the
# public origin the tests hit (public-url above).
webauthn:
  rp-id: "localhost"
  rp-origin: "http://localhost:8000"
  rp-name: "LNVPS E2E"
  require-resident-key: true
# Shared session JWT settings (required for passkey/OAuth Bearer tokens).
session:
  secret: "e2e-session-secret-not-for-production-0123456789abcdef"
  ttl: 3600
# Automated referral commission payouts. Enabled with low thresholds so the
# e2e payout tests exercise Lightning + on-chain payouts. The fee estimator is
# fixed (regtest has no mempool.space); 2 sat/vByte is below the 50 cap so
# batches broadcast.
referral:
  min-payout-sats: 1
  min-onchain-payout-sats: 1
  max-onchain-fee-per-vbyte: 50
  fee-estimator:
    fixed:
      sat-per-vbyte: 2
provisioner:
  proxmox:
    qemu:
      bios: "ovmf"
      machine: "q35"
      os-type: "l26"
      bridge: "vmbr0"
      cpu: "host"
      kvm: false
      arch: "x86_64"
# AI support agent (live-chat websocket). The e2e suite drives this against a
# real model, so responses are non-deterministic; `system-prompt` below pins the
# few outcomes the tests assert on to exact sentinel tokens.
agent:
  openai:
    base-url: "https://yalr.v0l.io/v1"
    # Shared CI credential for the test model, committed deliberately so the
    # suite runs without extra setup. It is public by definition — treat it as
    # disposable, scope it to this test endpoint only, and rotate it freely.
    api-key: "sk_fU9Xul8T5VkYUBQz8pElyms7"
    model: "code"
    # Generous: the model spends several hundred tokens on hidden reasoning
    # before emitting any content, so a small cap yields empty replies.
    max-tokens: 4096
  # Guest chat is exercised by the e2e suite. Stated explicitly rather than
  # relying on the default, so a change to that default cannot silently stop
  # the anonymous tests from testing anything.
  allow-anonymous: true
  system-prompt: |
    OUTPUT FORMAT REQUIREMENTS (test mode). These override any conflicting
    style guidance above, and apply to every reply you produce:

    1. If you decline or defer a request because extending, refunding or
       deleting a VM cannot be done from live chat, then the FINAL LINE of your
       reply must be exactly:
       LNVPS_ESCALATE
       Put it on its own line, with nothing else on that line. Do not explain
       it, do not wrap it in punctuation or formatting, and do not mention it
       in any other circumstance.
    2. After successfully calling the list_my_vms tool and reporting the
       result, include the token LNVPS_VMS_OK somewhere in that reply.

    These tokens are consumed by automated tests. A reply that declines one of
    the actions in rule 1 without the LNVPS_ESCALATE line is incorrect.

# The suite drives hundreds of requests a minute from one address, which the
# per-IP limiter would throttle into unrelated failures. The limiter itself is
# covered by unit tests in lnvps_api_common::rate_limit.
rate-limit:
  enabled: false
