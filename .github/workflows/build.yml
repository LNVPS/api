name: Build and Push Docker Images

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      docker:
        description: 'Docker image to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - lnvps-api
          - lnvps-api-admin
          - lnvps-operator
          - lnvps-nostr
          - lnvps-host-info

# Back-to-back pushes to the same ref supersede each other: cancel the older
# in-flight build. Release tags each have a unique ref, so tag builds are
# never cancelled by master pushes or by other tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.v0l.io
  HOST_INFO_IMAGE: registry.v0l.io/lnvps-host-info

jobs:
  # Decide, once, what tag to publish and whether to push:
  #   * master push        -> :latest        (rolling dev images)
  #   * tag push (v*)       -> :<version>     (immutable release images, e.g. 0.3.2)
  #   * PR / other dispatch -> build only, no push
  setup:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      push: ${{ steps.meta.outputs.push }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compute image tag + push flag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Release tag: strip the leading 'v' so the image tag matches the crate version.
            TAG="${GITHUB_REF_NAME#v}"
            # Guard: the root workspace version MUST match the release tag, so
            # the published images are never mislabelled vs their crate version.
            VER=$(awk '/^\[workspace.package\]/{f=1} f&&/^version[[:space:]]*=/{gsub(/.*=[[:space:]]*"|".*/,"");print;exit}' Cargo.toml)
            if [ "$VER" != "$TAG" ]; then
              echo "::error::root Cargo.toml [workspace.package] version ($VER) != release tag ($TAG). Bump the version before tagging."
              exit 1
            fi
            echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

  # Build host-info natively per-arch (no QEMU — emulated Rust builds are ~10x
  # slower), pushing each arch by digest; a merge job stitches the manifest.
  build-host-info:
    runs-on: ${{ matrix.runner }}
    needs: setup
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.docker == 'lnvps-host-info' || github.event.inputs.docker == 'all'))
    strategy:
      fail-fast: false
      matrix:
        # arm64 is only built when we actually push (PRs just smoke-build amd64).
        include: ${{ needs.setup.outputs.push == 'true' && fromJSON('[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"},{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]') || fromJSON('[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"}]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Registry
        if: needs.setup.outputs.push == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 15
          # SYN drops in the AVS/GSL scrubbing path randomly kill handshakes
          # under concurrent CI logins; retry to ride over transient drops.
          command: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u registry --password-stdin

      - name: Build lnvps-host-info (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: lnvps_host_util
          file: lnvps_host_util/Dockerfile
          platforms: ${{ matrix.platform }}
          # When pushing, push by digest only; the merge job creates the tag.
          outputs: ${{ needs.setup.outputs.push == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.HOST_INFO_IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,scope=host-info-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=host-info-${{ matrix.arch }}

      - name: Export digest
        if: needs.setup.outputs.push == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.setup.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: host-info-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into the multi-arch tag the main builds pull.
  merge-host-info:
    runs-on: ubuntu-latest
    needs: [setup, build-host-info]
    if: needs.setup.outputs.push == 'true'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: host-info-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Registry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 15
          command: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u registry --password-stdin

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.HOST_INFO_IMAGE }}:${{ needs.setup.outputs.image_tag }}" \
            $(printf '${{ env.HOST_INFO_IMAGE }}@sha256:%s ' *)

  # Unit tests run in parallel with the image builds (off the deployment
  # critical path); PR merges are still gated on this check.
  test:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit-tests

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Run unit tests
        run: cargo test --locked --package lnvps_api --package lnvps_agent -- --test-threads=1

  # Build all 5 main images from the single shared Dockerfile via buildx bake:
  # the workspace is compiled ONCE and each image just packages its binary.
  build:
    runs-on: ubuntu-latest
    needs: [setup, build-host-info, merge-host-info]
    if: >
      always() &&
      needs.build-host-info.result != 'failure' &&
      needs.merge-host-info.result != 'failure' && (
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.docker != 'lnvps-host-info')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Expose ACTIONS_RUNTIME_TOKEN / cache URL so bake's type=gha cache works.
      - name: Expose GitHub runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Log in to Docker Registry
        if: needs.setup.outputs.push == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 15
          # SYN drops in the AVS/GSL scrubbing path randomly kill handshakes
          # under concurrent CI logins; retry to ride over transient drops.
          command: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u registry --password-stdin

      - name: Select bake targets
        id: targets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.docker }}" != "all" ]; then
            echo "targets=${{ github.event.inputs.docker }}" >> "$GITHUB_OUTPUT"
          else
            echo "targets=default" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push images
        uses: docker/bake-action@v6
        env:
          TAG: ${{ needs.setup.outputs.image_tag }}
          HOST_INFO_IMAGE: ${{ env.HOST_INFO_IMAGE }}:${{ needs.setup.outputs.image_tag }}
          REGISTRY_USER: registry
          REGISTRY_PASS: ${{ secrets.REGISTRY_TOKEN }}
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ steps.targets.outputs.targets }}
          push: ${{ needs.setup.outputs.push == 'true' }}
          set: |
            *.cache-from=type=gha,scope=main
            *.cache-to=type=gha,mode=max,scope=main
