name: E2E Integration Tests

on:
  pull_request:
  workflow_dispatch:

# New pushes to a PR supersede the previous run: cancel the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            e2e-${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler jq

      - name: Run E2E tests
        env:
          LNVPS_E2E_RUN_ID: ${{ github.run_id }}_${{ github.run_attempt }}
        run: ./scripts/run-e2e.sh

      # The agent tests depend on a live LLM choosing to call a tool or emit a
      # sentinel token, which the small test model does not do reliably: each
      # run fails a different subset. They are `#[ignore]`d out of the blocking
      # suite but still run here, non-blocking, so a real regression in
      # prompt-injection resistance or cross-user isolation stays visible.
      - name: Run model-dependent agent tests (non-blocking)
        continue-on-error: true
        env:
          LNVPS_E2E_RUN_ID: ${{ github.run_id }}_${{ github.run_attempt }}_agent
        run: ./scripts/run-e2e.sh --no-build --filter agent_chat --ignored

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== User API log ==="
          cat /tmp/lnvps-e2e-api.log 2>/dev/null || true
          echo "=== Admin API log ==="
          cat /tmp/lnvps-e2e-admin-api.log 2>/dev/null || true
          echo "=== Docker compose logs ==="
          docker compose -f docker-compose.e2e.yaml logs --tail=50 2>/dev/null || true
