name: Build lnvps_fw .deb

# Builds the lnvps_fw_service daemon (including the eBPF datapath) into a Debian
# package that installs the binary + a systemd unit. On a tag the .deb is
# attached to the GitHub release.
#
# Triggers on a dedicated tag prefix (lnvps_fw-v*), the same convention as
# nixos-image.yml, so the firewall releases on its own cadence and does NOT run
# on the main `v*` API release tags (which drive build.yml). That decoupling is
# the point: the daemon's self-upgrade compares its compiled version against the
# newest firewall tag, so the two versions no longer have to move in lockstep.
on:
  push:
    tags:
      - "lnvps_fw-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Assert Cargo.toml version matches the release tag
        # The lnvps_fw workspace version drives the daemon self-upgrade check
        # (it compares its compiled CARGO_PKG_VERSION against the newest
        # lnvps_fw-vX.Y.Z release tag). If it lags the tag, every running daemon
        # reports an upgrade is available on startup and every 6h — so fail the
        # build rather than ship a mismatched .deb.
        if: startsWith(github.ref, 'refs/tags/lnvps_fw-v')
        run: |
          TAG="${GITHUB_REF_NAME#lnvps_fw-v}"
          VER=$(awk '/^\[workspace.package\]/{f=1} f&&/^version[[:space:]]*=/{gsub(/.*=[[:space:]]*"|".*/,"");print;exit}' lnvps_fw/Cargo.toml)
          echo "tag=$TAG  lnvps_fw/Cargo.toml=$VER"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::lnvps_fw/Cargo.toml version ($VER) != release tag ($TAG). Bump it before tagging lnvps_fw-v$VER."
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build dashboard (Vite single-file bundle)
        # The daemon embeds dashboard/dist/index.html via include_str!, so the
        # UI must be built before cargo compiles the service. Produces a single
        # self-contained index.html (JS + CSS inlined).
        working-directory: lnvps_fw/lnvps_fw_service/dashboard
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install system dependencies
        # bpf-linker needs LLVM; libelf is used by the aya-build eBPF pipeline.
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libelf-dev

      - name: Install Rust nightly (with rust-src for the eBPF build-std)
        # Pinned, not floating. Two reasons, both release-critical:
        #
        # * bpf-linker binds to one LLVM major, and the working combination is
        #   the toolchain's own LLVM (22 here) via aya's proxy — see the pin
        #   below. A floating nightly silently moves to LLVM 23 and breaks it.
        # * verifier acceptance is codegen-sensitive. The SNI ClientHello parse
        #   walks packet-derived offsets, and which bounds checks survive
        #   optimisation decides whether the program loads at all, so the
        #   artifact we ship should come from the toolchain the datapath tests
        #   were verified against.
        #
        # To move it: bump both pins together and re-run the root harness
        # (scripts/fw-e2e.sh) before tagging.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-17
          components: rust-src

      - name: Cache cargo + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            lnvps_fw/target
          key: fwdeb-${{ runner.os }}-${{ hashFiles('lnvps_fw/**/Cargo.lock') }}
          restore-keys: |
            fwdeb-${{ runner.os }}-

      - name: Install bpf-linker and cargo-deb
        # bpf-linker is pinned to the last version carrying the `rust-llvm-*`
        # feature: it loads the LLVM shipped inside the Rust toolchain, so the
        # runner needs no LLVM dev packages and cannot drift away from rustc's
        # LLVM. 0.11 dropped that feature and links a system LLVM 23 instead,
        # which no runner image has (`unable to find library -lLLVM`).
        #
        # Version-checked rather than presence-checked: ~/.cargo/bin is cached,
        # so "already installed" may mean "installed at the wrong version".
        env:
          BPF_LINKER_VERSION: 0.10.3
        run: |
          have=$(bpf-linker --version 2>/dev/null | awk '{print $2}')
          if [ "$have" != "$BPF_LINKER_VERSION" ]; then
            cargo install bpf-linker --locked --version "$BPF_LINKER_VERSION"
          fi
          command -v cargo-deb >/dev/null || cargo install cargo-deb --locked

      - name: Build .deb
        working-directory: lnvps_fw/lnvps_fw_service
        run: cargo deb

      - name: Locate artifact
        id: deb
        run: echo "path=$(ls lnvps_fw/target/debian/*.deb | head -1)" >> "$GITHUB_OUTPUT"

      - name: Show package contents
        run: dpkg-deb --info "${{ steps.deb.outputs.path }}" && dpkg-deb --contents "${{ steps.deb.outputs.path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: lnvps_fw-deb
          path: lnvps_fw/target/debian/*.deb

      - name: Attach to release
        # Only on a firewall tag: a manual dispatch build is an artifact, never
        # a release (the self-upgrade check must only ever see tagged builds).
        if: startsWith(github.ref, 'refs/tags/lnvps_fw-v')
        uses: softprops/action-gh-release@v3
        with:
          files: lnvps_fw/target/debian/*.deb
