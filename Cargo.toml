[workspace]
resolver = "3"
members = [
    "lnvps_db",
    "lnvps_compose",
    "lnvps_api",
    "lnvps_api_admin",
    "lnvps_api_common",
    "lnvps_nostr",
    "lnvps_operator",
    "lnvps_health",
    "try-procedure",
    "lnvps_e2e",
    "lnvps_agent",
]
# lnvps_fw is a separate workspace (eBPF build needs its own target/toolchain)
exclude = ["lnvps_fw"]

[workspace.package]
version = "0.4.7"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = [
    "catch-panic",
    "cors",
    "limit",
    "set-header",
] }
config = { version = "0.15", features = ["yaml"] }
hex = "0.4"
ipnetwork = "0.21"
payments-rs = { version = "0.7.0", default-features = false }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.13", features = ["json"] }
uuid = { version = "1.16", features = ["v4"] }

# NOTE: `panic = "abort"` was removed deliberately.
#
# Cargo's panic strategy is per-profile, not per-binary, so aborting turned any
# panic reachable from an HTTP handler into a full outage of the API process
# rather than a 500 on one request. Several such panics were reachable from
# unauthenticated input. Unwinding lets
# the API and admin routers catch a handler panic via `tower_http`'s
# `CatchPanicLayer` and keep serving.
#
# `lnvps_fw` is a separate workspace and is unaffected by this profile.
