services:
  relay:
    image: registry.v0l.io/ditto-relay:2.5.1-policy1@sha256:6e06f2c0ca80caea97055f121e1e59890aeba1dc3f297aabd998feb0ef6b0514
    user: "1000"
    resources: { cpu: 500m, memory: 1Gi }
    ports:
      - { name: ws, container: 13131, protocol: http, expose: ingress }
    files:
      - path: /etc/ditto-relay/ditto-relay.toml
        content: |
          url = "wss://${HOSTNAME}/"
          bind = "0.0.0.0:13131"
          metrics_bind = ""
          data_dir = "/data"
          name = "${relay_name}"
          description = "${relay_description}"
          max_subscriptions = ${max_subscriptions}
          max_filters = ${max_filters}
          default_limit = ${default_limit}
          max_limit = ${max_limit}
          max_message_size = ${max_message_size}
          max_future_seconds = ${max_future_seconds}
          auth_kinds = [${auth_kinds}]
          history = ${history}
          search = ${search}
          negentropy = ${negentropy}
          nip85 = ${nip85}
          write_policy_plugin = "/usr/local/bin/ditto-policy"
          write_policy_timeout_seconds = ${write_policy_timeout_seconds}
      - path: /etc/ditto-relay/policy.json
        content: |
          {
            "kinds": "${policy_kinds}",
            "allow": "${policy_allow_pubkeys}",
            "deny": "${policy_deny_pubkeys}",
            "min_pow": "${policy_min_pow}",
            "max_size": "${policy_max_event_bytes}",
            "per_minute": "${policy_events_per_minute}",
            "require_auth": "${policy_require_auth}"
          }
    volumes:
      - { name: data, path: /data, size: 5Gi, label: events }
    scratch:
      - { path: /tmp }
    backup: { exec: ["ditto-relay", "--config", "/etc/ditto-relay/ditto-relay.toml", "export"], artifact: ditto-relay-events.jsonl }
config:
  - { name: relay_name, label: "Relay name", type: string, default: "My Ditto relay", pattern: '[^"\\\r\n]*' }
  - { name: relay_description, label: "Description", type: string, default: "A personal Nostr relay", pattern: '[^"\\\r\n]*' }
  - { name: policy_kinds, label: "Write only these kinds (comma-separated, blank for all)", type: string, default: "", pattern: "([0-9]{1,5}(,[0-9]{1,5})*)?", group: "Write policy" }
  - { name: policy_allow_pubkeys, label: "Only these pubkeys may write (comma-separated 64-char hex, blank for anyone)", type: string, default: "", pattern: "([0-9a-f]{64}(,[0-9a-f]{64}){0,199})?", group: "Write policy" }
  - { name: policy_deny_pubkeys, label: "Blocked pubkeys (comma-separated 64-char hex)", type: string, default: "", pattern: "([0-9a-f]{64}(,[0-9a-f]{64}){0,199})?", group: "Write policy" }
  - { name: policy_min_pow, label: "Minimum proof of work (bits, 0 for none)", type: int, default: "0", pattern: "[0-9]{1,2}", group: "Write policy" }
  - { name: policy_max_event_bytes, label: "Max event size (bytes, 0 for no limit)", type: int, default: "0", pattern: "[0-9]{1,9}", group: "Write policy" }
  - { name: policy_events_per_minute, label: "Max events per address per minute (0 for no limit)", type: int, default: "0", pattern: "[0-9]{1,6}", group: "Write policy" }
  - { name: policy_require_auth, label: "Require NIP-42 AUTH to write", type: bool, default: "false", pattern: "true|false", group: "Write policy" }
  - { name: write_policy_timeout_seconds, label: "Write policy timeout (seconds)", type: int, default: "10", pattern: "[1-9][0-9]{0,2}", group: "Write policy" }
  - { name: auth_kinds, label: "Kinds readable only by their parties (comma-separated, blank for none)", type: string, default: "", pattern: "([0-9]+(, *[0-9]+)*)?", group: "Access" }
  - { name: max_subscriptions, label: "Max subscriptions per connection", type: int, default: "20", pattern: "[1-9][0-9]*", group: "Limits" }
  - { name: max_filters, label: "Max filters per REQ", type: int, default: "100", pattern: "[1-9][0-9]*", group: "Limits" }
  - { name: default_limit, label: "Default events returned per filter", type: int, default: "100", pattern: "[1-9][0-9]*", group: "Limits" }
  - { name: max_limit, label: "Max events returned per filter", type: int, default: "1000", pattern: "[1-9][0-9]*", group: "Limits" }
  - { name: max_message_size, label: "Max message size (bytes)", type: int, default: "4000000", pattern: "[1-9][0-9]*", group: "Limits" }
  - { name: max_future_seconds, label: "Reject events dated more than this far ahead (seconds)", type: int, default: "900", pattern: "[0-9]+", group: "Limits" }
  - { name: history, label: "Keep old versions of replaceable events", type: bool, default: "true", group: "Features" }
  - { name: search, label: "NIP-50 search", type: bool, default: "true", group: "Features" }
  - { name: negentropy, label: "NIP-77 negentropy sync", type: bool, default: "true", group: "Features" }
  - { name: nip85, label: "NIP-85 trusted assertions", type: bool, default: "true", group: "Features" }
