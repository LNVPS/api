[package]
name = "lnvps_agent"
version.workspace = true
edition.workspace = true
description = "AI support agent for LNVPS — processes support requests using an async-openai agent with API-calling tools"

[[bin]]
name = "lnvps_agent"
path = "src/main.rs"

[dependencies]
# The agent reads the database directly — both when hosted inside `lnvps_api`
# and when run as a standalone binary for the email/Nostr channels. There is no
# HTTP path to the admin API, and so no admin credential anywhere in the agent.
# `admin` is required for the two lookups that resolve a sender to an account
# (by pubkey, and by the indexed email hash).
lnvps_db = { path = "../lnvps_db", features = ["admin"] }
lnvps_api_common = { path = "../lnvps_api_common", features = ["admin"] }
payments-rs = { workspace = true, features = ["fiat"] }
tokio = { workspace = true, features = ["signal", "time"] }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { workspace = true }
serde_json.workspace = true
config = { workspace = true }
async-trait.workspace = true
reqwest = { workspace = true, features = ["json"] }
futures = { workspace = true }

async-openai = "0.28"
chrono = { version = "0.4", features = ["serde"] }
nostr = { version = "0.44", default-features = false, features = ["std"] }
nostr-sdk = { rev = "c69c4ae2bf1a5f340aba70c20d09323f5309a4e2", git = "https://github.com/rust-nostr/nostr", default-features = false }
base64 = "0.22"
hex = { workspace = true }

# Email support channel (IMAP poll + SMTP reply)
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures.workspace = true
