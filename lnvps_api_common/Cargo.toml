[package]
name = "lnvps_api_common"
version.workspace = true
edition.workspace = true

[features]
default = ["nostr-domain"]
nostr-domain = ["lnvps_db/nostr-domain"]
admin = ["lnvps_db/admin"]
# Proxmox hypervisor host client (shares SshClient with linux-ssh)
proxmox = ["dep:russh", "dep:russh-sftp", "dep:tokio-tungstenite"]
# LibVirt hypervisor host client. Pulls in native libvirt C bindings, so it is
# off by default and must be opted into explicitly.
libvirt = ["dep:virt", "dep:uuid", "dep:quick-xml"]
# Linux router managed over SSH (shares the SshClient with proxmox)
linux-ssh = ["dep:russh", "dep:russh-sftp"]

[dependencies]
lnvps_db = { path = "../lnvps_db" }
try-procedure = { path = "../try-procedure" }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
axum.workspace = true
tokio.workspace = true
hex.workspace = true
async-trait.workspace = true
ipnetwork.workspace = true
futures.workspace = true
payments-rs = { workspace = true, features = ["fiat"] }

chrono = { version = "0.4", features = ["serde"] }
base64 = { version = "0.22", features = ["alloc"] }
nostr = { version = "0.44", default-features = false, features = ["std"] }
# `stream` is needed to download OS images without buffering them in memory
reqwest = { version = "0.13", features = ["json", "stream"] }
rand = "0.9"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
isocountry = "0.3"
urlencoding = "2.1"
redis = { version = "1", features = ["tokio-comp", "cluster"] }
maxminddb = "0.29"

#proxmox / linux-ssh
tokio-tungstenite = { version = "0.28", features = ["native-tls"], optional = true }
russh = { version = "0.62", optional = true }
russh-sftp = { version = "2", optional = true }

#libvirt
virt = { git = "https://gitlab.com/libvirt/libvirt-rust.git", optional = true }
# v5 provides the deterministic per-VM libvirt domain UUIDs
uuid = { version = "1.16", features = ["v4", "v5", "serde"], optional = true }
quick-xml = { version = "0.39", features = ["serde", "serialize"], optional = true }

[dev-dependencies]
env_logger = "0.11"
sqlx = { version = "0.8", default-features = false }
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

