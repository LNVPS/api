[package]
name = "lnvps_node"
version.workspace = true
edition.workspace = true

[[bin]]
name = "lnvps-node"
path = "src/main.rs"

[dependencies]
lnvps_netlink = { path = "../lnvps_netlink" }
# Detection is shared with the `lnvps-host-info` binary so an operator's
# pre-flight check and the daemon's report cannot disagree about the machine.
# Built without the vendor libraries: a node must start on a host that has
# neither libva nor NVML installed.
lnvps_host_util = { path = "../lnvps_host_util", default-features = false }

nostr = { version = "0.44", default-features = false, features = ["std"] }
# The node's own WireGuard key, generated here so LNVPS never holds the private
# half. Generated in-process rather than by shelling out to `wg genkey`, and
# without depending on lnvps_api_common, which would pull the database, axum and
# the payment stack onto somebody else's hardware.
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
rand = "0.9"
hex.workspace = true
nftables.workspace = true
# Outbound calls to LNVPS: the node fetches the data plane it should be running.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Self-signed TLS identity, pinned by LNVPS at registration. Same crate and
# approach as lnvps_fw's control API.
rcgen = "0.13"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }

# Control API: axum over rustls. HTTPS is not optional — LNVPS pins the
# certificate (decision 14), which is what authenticates the node's replies.
axum = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Reads the tunnel interface's real addresses, so the bind check (decision 13)
# is made against the machine rather than against the config file restating
# itself.
if-addrs = "0.13"

tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "fs", "net", "signal"] }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
config.workspace = true
rtnetlink = "0.21"
defguard_wireguard_rs = "0.11"
futures-util = "0.3.33"
async-trait.workspace = true
ipnetwork.workspace = true
netlink-packet-route = "0.30"
nix = { version = "0.30", features = ["sched", "mount", "fs"] }

[dev-dependencies]
tempfile = "3"
# Builds responses for the API-client tests without a live server.
http = "1"
# Drives the router directly in tests, so authentication is exercised without
# binding a socket or terminating TLS.
tower = { version = "0.5", features = ["util"] }
# Integration tests speak real TLS to the daemon: reqwest as the pinned client
# LNVPS will be, tokio-rustls to observe the certificate actually presented.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
