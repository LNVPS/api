[package]
name = "lnvps_operator"
version.workspace = true
edition.workspace = true

[[bin]]
name = "lnvps_operator"
path = "src/main.rs"

[dependencies]
lnvps_db = { path = "../lnvps_db", features = ["nostr-domain"] }
lnvps_compose = { path = "../lnvps_compose" }
lnvps_api_common = { path = "../lnvps_api_common" }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# Workspace dependencies
tokio = { workspace = true, features = ["time", "signal"] }
uuid.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
config.workspace = true
clap = { version = "4.5.21", features = ["derive"] }
kube = { version = "1.1.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.25.0", features = ["latest"] }
# kube/sqlx use rustls but the dependency tree doesn't auto-select a default
# crypto provider, so we install the ring provider explicitly in main().
rustls = { version = "0.23", default-features = false, features = ["ring"] }