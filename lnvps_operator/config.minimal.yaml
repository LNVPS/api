# Minimal LNVPS Kubernetes Operator Configuration

# Database connection string
db: "mysql://root:root@localhost:3376/lnvps"

# Kubernetes namespace to watch
namespace: "lnvps"

# Service configuration for nostr domains
service-name: "lnvps-nostr"
port-name: "http"

# TLS certificate configuration
cluster-issuer: "letsencrypt-prod"

# Managed app deployments (omit both to run nostr-domains only).
# app-cluster-id enables app reconciliation for this cluster; encryption is
# required to decrypt app_deployment.config and MUST match the API's key
# (or set the LNVPS_ENCRYPTION_KEY env var instead of the key file).
# app-cluster-id: 1
# encryption:
#   key-file: "/etc/lnvps/encryption.key"
#   auto-generate: false

# Reconcile immediately on payment instead of at the next poll (optional).
# Same Redis the API publishes to; requires app-cluster-id.
# redis: "redis://localhost:6379"

# Ingress configuration (optional - defaults shown)
# ingress-class: "nginx"
# ingress-namespace: "ingress-nginx"
# reconcile-interval: 60
# error-retry-interval: 30
# verbose: false