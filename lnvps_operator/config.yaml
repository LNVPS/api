# LNVPS Kubernetes Operator Configuration
#
# Full reference — every setting the operator understands, with its default.
# Optional keys can be omitted; the shown value is the default unless noted.

# Database connection string (required)
db: "mysql://root:root@localhost:3376/lnvps"

# Kubernetes namespace to watch (optional, defaults to "default")
namespace: "lnvps"

# Reconciliation interval in seconds (optional, defaults to 60)
reconcile-interval: 60

# Error retry interval in seconds (optional, defaults to 30)  
error-retry-interval: 30

# Enable verbose logging (optional, defaults to false)
verbose: true

# --- Database field encryption (required to read encrypted columns) ---------
# The operator decrypts columns the API encrypted — notably
# `app_deployment.config`. The key MUST be identical to the API's, otherwise
# decryption fails. Precedence: the LNVPS_ENCRYPTION_KEY environment variable
# (64 hex chars = 32 bytes) overrides the key file below.
encryption:
  # Path to the 32-byte key file (same file/key the API uses).
  key-file: "/etc/lnvps/encryption.key"
  # Generate the key if the file doesn't exist (optional, defaults to false).
  # Leave false in production and share the API's existing key.
  auto-generate: false

# --- Managed app deployments ------------------------------------------------
# The app cluster this operator instance serves (optional). When set, the
# operator reconciles `app_deployment` rows whose cluster_id matches this into
# Kubernetes. When unset, app-deployment reconciliation is disabled (the
# operator only manages nostr domains). Requires `encryption` (above).
app-cluster-id: 1

# Redis carrying reconcile triggers for this cluster (optional). Point it at
# the same Redis the API uses. When set (with app-cluster-id), the operator
# consumes `app-cluster-{id}` and reconciles a deployment as soon as its
# payment settles, instead of waiting up to reconcile-interval. The periodic
# reconcile stays as the backstop, so a lost trigger is a delay rather than a
# deployment that never happens. Omit to poll only.
redis: "redis://localhost:6379"

# Prometheus to read deployment resource usage from (optional). When set, every
# reconcile pass records each deployment's CPU, memory and volume usage so the
# customer can see consumption against the quota they are paying for. The URL
# must be reachable from the operator. Omit to collect nothing — the API then
# reports usage as unknown rather than as zero.
prometheus:
  url: "http://prometheus.monitoring:9090"
  # Per-query timeout in seconds (optional, defaults to 10). Collection is
  # best-effort and must not hold up a reconcile pass.
  timeout-seconds: 10

# Namespace the ingress controller runs in (optional, defaults to
# "ingress-nginx"). The per-deployment isolation NetworkPolicy allows inbound
# traffic from this namespace; it must match that namespace's
# `kubernetes.io/metadata.name` label. For a hostNetwork ingress controller the
# source is the node IP, not this namespace — see docs.
ingress-namespace: "ingress-nginx"

# --- Nostr domains ----------------------------------------------------------
# Service name for nostr domain ingress (optional, defaults to "lnvps-nostr")
# All nostr domains will point to this single service
service-name: "lnvps-nostr"

# Service port name for nostr domain ingress (optional, defaults to "http")
port-name: "http"

# Cert-manager cluster issuer name (optional, defaults to "letsencrypt-prod")
# Used to automatically generate TLS certificates for nostr domains AND managed
# app-deployment ingresses.
cluster-issuer: "letsencrypt-prod"

# Ingress class name (optional, defaults to "nginx"). Applied via the modern
# `spec.ingressClassName` on generated Ingress objects.
ingress-class: "nginx"

# Additional custom annotations for the nostr-domain ingress (optional)
# These will be merged with the default annotations
# Custom annotations take precedence over defaults
annotations:
  # Example: Enable rate limiting
  nginx.ingress.kubernetes.io/rate-limit: "100"
  nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  
  # Example: Set client body size
  nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  
  # Example: Enable CORS
  nginx.ingress.kubernetes.io/enable-cors: "true"
  nginx.ingress.kubernetes.io/cors-allow-origin: "*"
  
  # Example: Custom SSL settings (overrides the default ssl-redirect: false)
  nginx.ingress.kubernetes.io/ssl-redirect: "true"
  
  # Example: Custom backend protocol
  nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  
  # Example: Add custom headers
  nginx.ingress.kubernetes.io/configuration-snippet: |
    more_set_headers "X-Frame-Options: SAMEORIGIN";
    more_set_headers "X-Content-Type-Options: nosniff";