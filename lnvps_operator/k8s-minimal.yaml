---
# Minimal LNVPS Operator Deployment
# This is a simplified version for quick deployment

apiVersion: v1
kind: Namespace
metadata:
  name: lnvps-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lnvps-operator
  namespace: lnvps-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lnvps-operator
rules:
# Namespaces: one dedicated namespace per app deployment (isolation boundary),
# plus cluster-scoped listing for namespace garbage collection.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Core resources created inside each deployment namespace.
- apiGroups: [""]
  resources: ["services", "secrets", "configmaps", "persistentvolumeclaims", "resourcequotas"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Pods are read-only: the replica counts say a workload is not ready, only the
# container statuses say why, and that reason is what the customer sees.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# Workloads.
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Ingress (nostr domains + app deployments) and per-deployment isolation policy.
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lnvps-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lnvps-operator
subjects:
- kind: ServiceAccount
  name: lnvps-operator
  namespace: lnvps-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lnvps-operator-config
  namespace: lnvps-system
data:
  config.yaml: |
    # CHANGE THESE VALUES FOR YOUR SETUP
    # The database DSN is a credential and is NOT here: it comes from the
    # lnvps-operator-db Secret through LNVPS_DATABASE_URL below.
    namespace: "default"
    service-name: "lnvps-nostr"
    port-name: "http"
    cluster-issuer: "letsencrypt-prod"
    verbose: true
    # --- Managed app deployments (omit to run nostr-domains only) ---
    # The app cluster this operator instance serves; enables app reconciliation.
    app-cluster-id: 1
    # Namespace the ingress controller runs in (isolation NetworkPolicy allows it).
    ingress-namespace: "ingress-nginx"
    # Encryption key: supplied via the LNVPS_ENCRYPTION_KEY env var below (must
    # match the API's key) so the operator can decrypt app_deployment.config.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lnvps-operator
  namespace: lnvps-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lnvps-operator
  template:
    metadata:
      labels:
        app: lnvps-operator
    spec:
      serviceAccountName: lnvps-operator
      containers:
      - name: lnvps-operator
        image: lnvps-operator:latest  # UPDATE THIS
        args: ["--config", "/etc/config/config.yaml"]
        env:
        - name: RUST_LOG
          value: "info"
        # Database field-encryption key (hex). MUST match the API's key so the
        # operator can decrypt app_deployment.config. Required for app
        # deployments; omit if running nostr-domains only.
        - name: LNVPS_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: lnvps-operator-encryption
              key: key
        # Connection string for the operator's own MySQL user: SELECT on the
        # schema, UPDATE on app_deployment, nothing else. See README.md.
        # Create this Secret before applying the Deployment — the reference is
        # required, so without it the container never starts.
        - name: LNVPS_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: lnvps-operator-db
              key: url
        volumeMounts:
        - name: config
          mountPath: /etc/config
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: lnvps-operator-config