---
# Minimal LNVPS Operator Deployment
# This is a simplified version for quick deployment

apiVersion: v1
kind: Namespace
metadata:
  name: lnvps-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lnvps-operator
  namespace: lnvps-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lnvps-operator
# Every rule below is a verb the reconcile loop issues. The operator holds no
# watches, so `watch` is granted nowhere; server-side apply needs `create` as
# well as `patch`, because the first pass creates the object.
rules:
# One namespace per deployment, listed cluster-wide for garbage collection and
# deleted when its deployment is gone.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["list", "create", "patch", "delete"]
# Applied into each deployment namespace, never read back.
- apiGroups: [""]
  resources: ["services", "configmaps", "persistentvolumeclaims"]
  verbs: ["create", "patch"]
# Secrets are NOT here: they are granted per deployment namespace by the
# lnvps-operator-appns ClusterRole below, bound by the operator as it creates
# each namespace. These two rules are what let it write that binding without
# holding the secret verbs cluster-wide.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["create", "patch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles"]
  resourceNames: ["lnvps-operator-appns"]
  verbs: ["bind"]
# Namespaces are no longer quota'd; the rule exists to remove objects left by
# deployments provisioned before that change.
- apiGroups: [""]
  resources: ["resourcequotas"]
  verbs: ["delete"]
# Read-only: the replica counts say a workload is not ready, only the container
# statuses say why, and that reason is what the customer sees.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["list", "create", "patch"]
# Nostr domain ingresses are read, replaced and deleted by name; app ingresses
# are server-side applied.
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "patch"]
---
# Namespace-scoped grant. Never bound cluster-wide: the operator creates a
# RoleBinding to it inside each app-N namespace it provisions, so a stolen
# token reads only the namespaces the operator itself created.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lnvps-operator-appns
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lnvps-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lnvps-operator
subjects:
- kind: ServiceAccount
  name: lnvps-operator
  namespace: lnvps-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lnvps-operator-config
  namespace: lnvps-system
data:
  config.yaml: |
    # CHANGE THESE VALUES FOR YOUR SETUP
    # The database DSN is a credential and is NOT here: it comes from the
    # lnvps-operator-db Secret through LNVPS_DATABASE_URL below.
    namespace: "default"
    service-name: "lnvps-nostr"
    port-name: "http"
    cluster-issuer: "letsencrypt-prod"
    verbose: true
    # --- Managed app deployments (omit to run nostr-domains only) ---
    # The app cluster this operator instance serves; enables app reconciliation.
    app-cluster-id: 1
    # Namespace the ingress controller runs in (isolation NetworkPolicy allows it).
    ingress-namespace: "ingress-nginx"
    # Encryption key: supplied via the LNVPS_ENCRYPTION_KEY env var below (must
    # match the API's key) so the operator can decrypt app_deployment.config.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lnvps-operator
  namespace: lnvps-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lnvps-operator
  template:
    metadata:
      labels:
        app: lnvps-operator
    spec:
      serviceAccountName: lnvps-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: lnvps-operator
        image: lnvps-operator:latest  # UPDATE THIS
        args: ["--config", "/etc/config/config.yaml"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
        - name: RUST_LOG
          value: "info"
        # Identity the operator names as the subject of the per-namespace
        # RoleBinding it writes. Without both, it creates no binding and falls
        # back to whatever grant it already holds.
        - name: LNVPS_OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: LNVPS_OPERATOR_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        # Database field-encryption key (hex). MUST match the API's key so the
        # operator can decrypt app_deployment.config. Required for app
        # deployments; omit if running nostr-domains only.
        - name: LNVPS_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: lnvps-operator-encryption
              key: key
        # Connection string for the operator's own MySQL user: SELECT on the
        # schema, UPDATE on app_deployment, nothing else. See README.md.
        # Create this Secret before applying the Deployment — the reference is
        # required, so without it the container never starts.
        - name: LNVPS_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: lnvps-operator-db
              key: url
        volumeMounts:
        - name: config
          mountPath: /etc/config
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: lnvps-operator-config